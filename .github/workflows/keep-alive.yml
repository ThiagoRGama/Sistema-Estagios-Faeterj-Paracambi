name: Keep Render and Neon awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: render-neon-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping API and database health check
        run: >-
          curl
          --fail
          --silent
          --show-error
          --max-time 180
          https://sistema-estagios-faeterj.onrender.com/api/v1/health
